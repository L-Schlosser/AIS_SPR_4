# Document Information Extraction — mobile NER pipeline configuration

model:
  # German BERT base — strong German understanding, ~110 MB INT8, low latency.
  # For maximum quality (slower, ~340 MB INT8) switch to "deepset/gbert-large".
  base_model: "deepset/gbert-base"
  tokenizer_cased: true
  max_length: 384
  fine_tune_synthetic: true
  synthetic_epochs: 6
  synthetic_samples_per_type: 1200
  learning_rate: 3.0e-5
  warmup_ratio: 0.06
  weight_decay: 0.01
  batch_size: 16
  eval_ratio: 0.08

# German UI labels returned to Flutter (internal field -> display key)
field_display_de:
  company: firma
  customer: kunde
  address: adresse
  customer_address: kundenadresse
  date: datum
  time: uhrzeit
  due_date: faelligkeitsdatum
  delivery_date: lieferdatum
  total: gesamtbetrag
  subtotal: nettobetrag
  vat: mwst_betrag
  vat_rate: mwst_satz
  currency: waehrung
  invoice_number: rechnungsnummer
  receipt_number: belegnummer
  order_number: bestellnummer
  customer_number: kundennummer
  delivery_number: lieferscheinnummer
  payment_method: zahlungsart
  iban: iban
  bic: bic
  bank_name: bank
  vat_id: uid
  company_register_number: firmenbuchnummer
  phone: telefon
  fax: fax
  email: email
  website: webseite
  contact_person: ansprechpartner
  patient: patient
  birth_date: geburtsdatum
  insurer: versicherungstraeger
  insurance_number: versicherungsnummer
  doctor: arzt
  doctor_address: arztadresse
  start_date: startdatum
  end_date: enddatum
  issue_date: ausstellungsdatum
  diagnosis: diagnose

paths:
  pytorch_model_dir: "models/pytorch"
  onnx_model_dir: "models/onnx"
  onnx_model_file: "model.onnx"
  tokenizer_dir: "models/onnx/tokenizer"

